# Here we create all files from /etc in /var/etc with defaults from /usr/share/factory/etc which need to be persistently writeable and Symlink them from /etc

d /var/etc 0755 root root -
f /var/etc/hostname 0644 root root - nfsense
L+ /etc/hostname - - - - /var/etc/hostname

# TODO Machine ID? Should we even persist it? we currently use firmware id

L /var/etc/localtime - - - - ../../usr/share/zoneinfo/Etc/UTC
L+ /etc/localtime - - - - /var/etc/localtime

# apparmor
L /etc/audit
